    .logo {
      position: absolute;
      left: 30.47%; top: 34.3%;
      width: 24.85%;
      transform: translateX(-50%);
    }
    .contacto {
      position: absolute;
      left: 30.47%; top: 72%;
      width: 33.8%;
      transform: translateX(-50%);
    }
    .logo img, .contacto img { display: block; width: 100%; height: auto; }
    .contacto a {
      position: absolute; bottom: 0; height: 48%;
      border-radius: 2px;
    }
    .contacto a:focus-visible { outline: 1px solid var(--tinta); outline-offset: 3px; }
    .contacto .tel { left: 13.5%; width: 41.5%; }
    .contacto .mail { left: 57.5%; width: 29%; }
    .retrato { display: none; }

    /* Pantallas más cuadradas: corre el encuadre un poco a la derecha
       para que no se corte el contacto. */
    @media (max-aspect-ratio: 17/10) {
      .lienzo { transform: translate(-52%, -50%); }
    }
